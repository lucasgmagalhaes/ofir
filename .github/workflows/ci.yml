name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the push before it; runs
# on main and release branches always finish (ADR 0091).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / LLVM ${{ matrix.llvm }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # Oldest and newest supported LLVM versions: tools/llvm.json (ADR 0084).
        # Bump the newest one within a month of a new LLVM release.
        llvm: ["17", "21"]
        # The two halves of `make test` (Makefile, ADR 0091): together they
        # are `make test`, so the shards drop no check.
        shard: ["1", "2"]

    steps:
      - uses: actions/checkout@v4

      - name: Use the main Ubuntu mirror (Linux)
        if: runner.os == 'Linux'
        # The runners' Azure apt mirror sometimes fails to resolve for hours.
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
          echo "OFIR_CLANG=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm }}
          echo "OFIR_CLANG=$(brew --prefix llvm@${{ matrix.llvm }})/bin/clang" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          cc --version
          "$OFIR_CLANG" --version
          python3 --version

      # gdb for tools/check_debugger.py and tools/check_dap.py, which make
      # test runs; ptrace_scope 0 lets check_dap.py attach to a process.
      - name: Install gdb, valgrind and the profile runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb valgrind libclang-rt-${{ matrix.llvm }}-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0

      # The full output stays in the job log and in build/logs, which a
      # failed job uploads.
      - name: Build and test
        shell: bash
        run: |
          mkdir -p build/logs
          make test-shard-${{ matrix.shard }} 2>&1 | tee build/logs/test-shard-${{ matrix.shard }}.log

      # Cross compilation (ADR 0066): the run tests built for aarch64 Linux
      # and run under qemu-user. In shard 1, the shorter one.
      - name: Cross tests (aarch64 Linux)
        if: runner.os == 'Linux' && matrix.shard == '1'
        env:
          OFIR_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          sudo apt-get install -y qemu-user libc6-dev-arm64-cross \
            libgcc-13-dev-arm64-cross binutils-aarch64-linux-gnu
          make test-cross TARGET=aarch64-linux-gnu

      # Memory, race and fault checks of the generated programs (Linux:
      # valgrind, gcc's sanitizer runtimes and glibc; ADR 0087). Here every
      # check must run: an unavailable one fails instead of being skipped.
      - name: Leaks, sanitizers and faults
        if: runner.os == 'Linux' && matrix.shard == '1'
        run: |
          sudo apt-get install -y valgrind
          make check-safety
          make check-leaks check-asan check-tsan check-faults SAFETY_FLAGS=--require

      # Tests that failed once and then passed (tests/runner/run_tests.py):
      # they count as passed, so they are listed where a reviewer sees them.
      - name: Report flaky tests
        if: always()
        shell: bash
        run: tools/ci_flaky_summary.sh

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-llvm${{ matrix.llvm }}-shard${{ matrix.shard }}
          path: |
            build/logs/
            tests/**/*.actual
          if-no-files-found: ignore
          retention-days: 14

  # Coverage of both compilers, the runtime and std (ADR 0103): `make
  # coverage`, uploaded to Codecov with a flag each (codecov.yml).
  coverage:
    name: coverage / ubuntu-24.04 / LLVM 21
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the main Ubuntu mirror
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install LLVM, gdb, the profile runtime and gcovr
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get install -y gdb libclang-rt-21-dev
          sudo sysctl -w kernel.yama.ptrace_scope=0
          pipx install gcovr
          echo "OFIR_CLANG=clang-21" >> "$GITHUB_ENV"
          echo "OFIR_LLVM_COV=llvm-cov-21" >> "$GITHUB_ENV"

      - name: Measure coverage
        shell: bash
        run: |
          mkdir -p build/logs
          make coverage 2>&1 | tee build/logs/coverage.log

      - name: Upload stage 0 to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/stage0.xml
          flags: stage0
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload stage 1 to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/stage1.xml
          flags: stage1
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload the runtime to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/runtime.xml
          flags: runtime
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload std to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/std.xml
          flags: std
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/
            build/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Windows (roadmap 6.8): clang for the MinGW target, run from Git Bash
  # (docs/design/toolchain.md, section 7).
  windows:
    name: windows-2025 / LLVM
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "/c/mingw64/bin" >> "$GITHUB_PATH"
          export PATH="/c/mingw64/bin:$PATH"
          command -v clang mingw32-make gcc python || true
          clang --version
          gcc --version | head -1
          python --version

      - name: Build and test
        run: |
          mkdir -p build/logs
          mingw32-make test 2>&1 | tee build/logs/test.log

      - name: Report flaky tests
        if: always()
        run: tools/ci_flaky_summary.sh

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-2025
          path: |
            build/logs/
            tests/**/*.actual
          if-no-files-found: ignore
          retention-days: 14
