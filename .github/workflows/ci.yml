name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / LLVM ${{ matrix.llvm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # Oldest and newest supported LLVM versions (ADR 0001).
        # Bump the newest one when a new LLVM release is published.
        llvm: ["17", "21"]

    steps:
      - uses: actions/checkout@v4

      - name: Use the main Ubuntu mirror (Linux)
        if: runner.os == 'Linux'
        # The runners' Azure apt mirror sometimes fails to resolve for hours.
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
          echo "OFIR_CLANG=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm }}
          echo "OFIR_CLANG=$(brew --prefix llvm@${{ matrix.llvm }})/bin/clang" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          cc --version
          "$OFIR_CLANG" --version
          python3 --version

      # gdb for tools/check_debugger.py, which make test runs.
      - name: Install gdb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gdb

      - name: Build and test
        run: make test

      # Cross compilation (ADR 0066): the run tests built for aarch64 Linux
      # and run under qemu-user.
      - name: Cross tests (aarch64 Linux)
        if: runner.os == 'Linux'
        env:
          OFIR_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          sudo apt-get install -y qemu-user libc6-dev-arm64-cross \
            libgcc-13-dev-arm64-cross binutils-aarch64-linux-gnu
          make test-cross TARGET=aarch64-linux-gnu

      # Memory checks of the generated programs (Linux: valgrind, and gcc's
      # sanitizer runtimes).
      - name: Leaks and sanitizers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          make check-leaks check-asan

  # Windows (roadmap 6.8): clang for the MinGW target, run from Git Bash
  # (docs/design/toolchain.md, section 7).
  windows:
    name: windows-2025 / LLVM
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "/c/mingw64/bin" >> "$GITHUB_PATH"
          export PATH="/c/mingw64/bin:$PATH"
          command -v clang mingw32-make gcc python || true
          clang --version
          gcc --version | head -1
          python --version

      - name: Build and test
        run: mingw32-make test
