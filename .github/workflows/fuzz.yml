name: Fuzz

# libFuzzer on the stage 0 lexer, parser and checker (roadmap 6.33i,
# tools/libfuzz.py). Nightly and by hand; a finding fails the job and its
# minimized input is uploaded, to become a seed of tests/fuzz/frontend/.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds for each target"
        default: "600"

permissions:
  contents: read

jobs:
  libfuzzer:
    name: libfuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz the front end
        run: python3 tools/libfuzz.py --seconds "${{ inputs.seconds || '600' }}" --jobs 2

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload the findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: build/fuzz/findings
