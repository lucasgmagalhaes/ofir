name: Performance

# Compares the compiler's performance with the base branch on every pull
# request, and records it for every commit on main (docs/design/performance.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the base revision is needed for the comparison

      - name: Use the main Ubuntu mirror
        # The runners' Azure apt mirror sometimes fails to resolve for hours.
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        # Instruction counts are deterministic, so the gate is reliable on
        # shared runners; wall times are reported for information only.
        run: tools/bench_compare.sh origin/${{ github.base_ref }}

      - name: Measure
        if: github.event_name == 'push'
        run: |
          make -C bootstrap release BUILD=$PWD/build/release
          python3 bench/run_bench.py --json build/bench-results.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: build/bench-results.json

  generated-code:
    runs-on: ubuntu-24.04
    env:
      OFIR_CLANG: clang-17
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchains
        run: |
          clang-17 --version
          rustc --version
          go version

      - name: Compare generated programs with C, Rust and Go
        run: make bench-programs BENCH_PROGRAM_RUNS=3

      - uses: actions/upload-artifact@v4
        with:
          name: generated-code-results-${{ github.sha }}
          path: build/generated-code-results.json
