name: Release

# Publishes a release, its seed (docs/bootstrap.md) and its archives
# (ADR 0082). The seed is the LLVM IR that the compiler writes for itself,
# checked by building the compiler from it on every CI platform; each
# archive is built and installed on its own target's runner before the
# release is created.
#
# A release starts as a candidate (ADR 0084): with `candidate` N it is
# tagged `v<version>-rc.N` and published as a pre-release. Without it, the
# workflow promotes the last candidate on the same commit, and fails
# unless the seed and every archive hash the same as the candidate's.
# docs/releasing.md is the checklist.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal VERSION in compiler/driver/version.of)"
        required: true
      candidate:
        description: "Candidate number N: tag v<version>-rc.N as a pre-release (empty: promote)"
        required: false
        default: ""
      publish:
        description: "Create the release (off: only build and check the seed)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  seed:
    name: seed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "OFIR_CLANG=clang-21" >> "$GITHUB_ENV"

      - name: Check the version
        run: |
          version=$(sed -n 's/^pub const VERSION: str = "\(.*\)"/\1/p' compiler/driver/version.of)
          if [ "$version" != "${{ inputs.version }}" ]; then
            echo "compiler/driver/version.of has version $version, not ${{ inputs.version }}"
            exit 1
          fi

      - name: Build the seed
        run: make seed

      - uses: actions/upload-artifact@v4
        with:
          name: seed
          path: |
            build/seed/ofir-${{ inputs.version }}.ll
            build/seed/ofir-${{ inputs.version }}.ll.sha256

  check:
    name: check ${{ matrix.os }} / LLVM ${{ matrix.llvm }}
    needs: seed
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        llvm: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
          echo "OFIR_CLANG=clang-${{ matrix.llvm }}" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm }}
          echo "OFIR_CLANG=$(brew --prefix llvm@${{ matrix.llvm }})/bin/clang" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: seed
          path: seed-download

      - name: Build the compiler from the seed
        run: make check-seed SEED=seed-download/ofir-${{ inputs.version }}.ll

      - name: Build and install the archive
        if: matrix.llvm == '21'
        run: |
          make dist
          python3 tools/check_install.py --compiler build/stage1/ofir --runtime build/libofir_rt.a

      - name: The corpus of this minor passes unchanged
        if: matrix.llvm == '21' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          OFIR_STD=$PWD/std OFIR_RUNTIME=$PWD/build/libofir_rt.a \
            python3 tools/check_compat.py --compiler build/stage1/ofir --release-branch

      - uses: actions/upload-artifact@v4
        if: matrix.llvm == '21'
        with:
          name: dist-${{ matrix.os }}
          path: build/dist/*

  # Windows (roadmap 6.8): clang for the MinGW target, as in ci.yml.
  check-windows:
    name: check windows-2025 / LLVM
    needs: seed
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use the MinGW toolchain
        run: echo "/c/mingw64/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: seed
          path: seed-download

      - name: Build the compiler from the seed
        run: mingw32-make check-seed SEED=seed-download/ofir-${{ inputs.version }}.ll

      - name: Build and install the archive
        run: |
          mingw32-make dist
          python tools/check_install.py --compiler build/stage1/ofir.exe --runtime build/libofir_rt.a

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: build/dist/*

  release:
    name: release
    needs: [check, check-windows]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seed
          path: seed-download

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          (cd dist && sha256sum ofir-*.tar.gz > SHA256SUMS)
          if [ -n "$CANDIDATE" ]; then
            tag="v$VERSION-rc.$CANDIDATE"
            title="Ofir $VERSION-rc.$CANDIDATE"
            extra=--prerelease
          else
            # Promote the last candidate on this commit: same bytes (ADR 0083).
            git fetch --quiet --tags origin
            rc=$(git tag --points-at "$GITHUB_SHA" "v$VERSION-rc.*" | sort -V | tail -n 1)
            if [ -z "$rc" ]; then
              echo "no candidate v$VERSION-rc.N on $GITHUB_SHA: publish one first"
              exit 1
            fi
            gh release download "$rc" --dir rc -p SHA256SUMS -p "ofir-$VERSION.ll.sha256"
            cmp rc/SHA256SUMS dist/SHA256SUMS
            cmp "rc/ofir-$VERSION.ll.sha256" "seed-download/ofir-$VERSION.ll.sha256"
            echo "the archives and the seed are those of $rc"
            tag="v$VERSION"
            title="Ofir $VERSION"
            extra=
          fi
          # The CHANGELOG section of this version, then the seed checksum.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Seed"
            echo
            echo '```'
            cat "seed-download/ofir-$VERSION.ll.sha256"
            echo '```'
          } >> notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" $extra \
            --notes-file notes.md \
            "seed-download/ofir-$VERSION.ll" "seed-download/ofir-$VERSION.ll.sha256" \
            dist/ofir-*.tar.gz dist/ofir-*.tar.gz.sha256 dist/SHA256SUMS
